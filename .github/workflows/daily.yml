name: Daily Crawl

on:
  schedule:
    # UTC 23:30 = 北京时间 07:30
    - cron: '30 23 * * *'
  workflow_dispatch:
    inputs:
      refetch_empty:
        description: '重抓正文为空的条目（一次性修复，不推送）'
        type: boolean
        default: false

jobs:
  crawl:
    # 请在下方填入你的ghid，Action只在本人仓库运行，如果不做修改job会被跳过
    if: github.repository_owner == 'Whisssssss'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # 恢复历史库，实现跨天去重（cache 不可覆盖，用 run_id 做新 key + 前缀恢复）
      - name: Restore database
        uses: actions/cache@v4
        with:
          path: scut.sqlite
          key: db-${{ github.run_id }}
          restore-keys: db-

      - name: Build config from secrets
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: |
          python - <<'EOF'
          import json, os
          cfg = json.load(open("config.example.json", encoding="utf-8"))
          cfg["smtp"]["user"] = os.environ["SMTP_USER"]
          cfg["smtp"]["password"] = os.environ["SMTP_PASS"]
          cfg["smtp"]["to"] = os.environ["SMTP_USER"]
          json.dump(cfg, open("config.json", "w", encoding="utf-8"), ensure_ascii=False, indent=2)
          EOF

      - name: Crawl
        env:
          # 可选：国内反向代理地址，解决 jw.scut.edu.cn 的 403；留空则用官方域名
          JW_BASE: ${{ secrets.JW_BASE }}
        run: |
          if [ "${{ inputs.refetch_empty }}" = "true" ]; then
            python fetch.py --days 3 --refetch-empty --no-push
          else
            python fetch.py --days 3
          fi

      - name: Stats
        run: |
          python - <<'PY'
          import sqlite3
          c = sqlite3.connect("scut.sqlite")
          total = c.execute("select count(*) from notices").fetchone()[0]
          empty = c.execute("select count(*) from notices where body=''").fetchone()[0]
          print(f"库内 {total} 条，正文为空 {empty} 条")
          PY
